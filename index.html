<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
 <meta name="enamad" content="19762973" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>19762973 - به زودی</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0a0a0a;
    color: #f5f5f5;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    position: relative;
  }

  /* هاله نورانی پس‌زمینه */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(120, 120, 255, 0.08), transparent 60%);
    pointer-events: none;
  }

  header {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: 24px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    letter-spacing: 2px;
    color: #888;
    z-index: 2;
  }

  header .brand {
    color: #f5f5f5;
    font-weight: 600;
  }

  main {
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }

  h1 {
    font-size: clamp(2.5rem, 8vw, 5rem);
    font-weight: 300;
    letter-spacing: 6px;
    background: linear-gradient(180deg, #ffffff 0%, #777 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: fadeUp 1.2s ease both;
  }

  p {
    font-size: clamp(0.9rem, 2.5vw, 1.05rem);
    color: #999;
    max-width: 480px;
    line-height: 1.9;
    animation: fadeUp 1.2s ease 0.2s both;
  }

  .line {
    width: 60px;
    height: 1px;
    background: #444;
    animation: fadeUp 1.2s ease 0.4s both;
  }

  footer {
    position: absolute;
    bottom: 24px;
    font-size: 12px;
    color: #555;
    letter-spacing: 1px;
    z-index: 2;
  }

  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @media (max-width: 480px) {
    header {
      padding: 18px 20px;
      font-size: 12px;
    }
    h1 {
      letter-spacing: 4px;
    }
  }
</style>
</head>
<body>
  <header>
    <span class="brand">BRAND</span>
    <span>۱۴۰۴</span>
  </header>

  <main>
    <h1>به زودی</h1>
    <div class="line"></div>
    <p>ما در حال آماده‌سازی چیزی خاص برای شما هستیم. به‌زودی از ما خبردار شوید.</p>
  </main>

  <footer>© تمامی حقوق محفوظ است</footer>
</body>
</html>
